      <rect x="225" width="220" height="54" rx="18" fill="#0F172A" opacity="0.72" stroke="#86EFAC"/>
      <text x="249" y="35" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">Health score</text>
      <rect x="465" width="260" height="54" rx="18" fill="#0F172A" opacity="0.72" stroke="#FDE68A"/>
      <text x="489" y="35" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">Secure accounts</text>
    </g>
