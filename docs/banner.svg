<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Personal Finance Analyzer banner</title>
  <desc id="desc">Dark analytics dashboard banner with budget cards, charts, and secure finance signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#102A43"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(840 100) rotate(128) scale(360 260)">
      <stop stop-color="#5EEAD4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="34" fill="url(#glow)"/>
  <circle cx="1040" cy="70" r="120" fill="#38BDF8" opacity="0.12"/>
  <circle cx="120" cy="290" r="160" fill="#22C55E" opacity="0.12"/>
  <g opacity="0.22">
