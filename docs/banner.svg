    <path d="M84 292C170 248 250 250 330 202C420 148 498 174 588 142C676 110 742 128 820 116C910 102 996 122 1118 98" stroke="#93C5FD" stroke-width="2"/>
  </g>
  <g transform="translate(80 70)">
