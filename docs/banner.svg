    <text x="0" y="62" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="900">Personal Finance Analyzer</text>
    <text x="0" y="112" fill="#CFFAFE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="500">Import transactions. Understand spending. Act on budget signals.</text>
